[package]
name = "openraid-desktop"
version = "1.2.1"
edition = "2021"
rust-version = "1.90"
description = "Optional native desktop interface for Openraid"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
openraid = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "fs"] }

[dev-dependencies]
tempfile = "3"

# This independent manifest intentionally keeps WebView/Tauri dependencies out
# of the default terminal build and its Cargo.lock.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
