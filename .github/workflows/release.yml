name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: target/release/openraid
            desktop_binary: desktop/src-tauri/target/release/openraid-desktop
          - os: windows-2022
            platform: windows-x86_64
            binary: target/release/openraid.exe
            desktop_binary: desktop/src-tauri/target/release/openraid-desktop.exe
          - os: macos-15-intel
            platform: darwin-x86_64
            binary: target/release/openraid
            desktop_binary: desktop/src-tauri/target/release/openraid-desktop
          - os: macos-15
            platform: darwin-arm64
            binary: target/release/openraid
            desktop_binary: desktop/src-tauri/target/release/openraid-desktop
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Verify version matches release tag
        run: python scripts/package-release.py --verify-tag "$GITHUB_REF_NAME"
      # Check the default graph before installing any desktop/WebView prerequisites.
      - name: Verify default TUI dependency isolation
        shell: python
        run: |
          import json
          import subprocess
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--format-version", "1"
          ]))
          forbidden = {"tauri", "tauri-build", "tauri-runtime", "tauri-runtime-wry", "wry", "webkit2gtk", "webview2-com"}
          leaked = sorted({package["name"] for package in metadata["packages"]} & forbidden)
          assert not leaked, f"Desktop dependencies leaked into the default build: {leaked}"
      - name: Install locked sidecar dependencies
        run: npm ci --prefix scripts
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run native and integration tests
        run: cargo test --locked --all-targets -- --include-ignored
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify SDK and transport behavior
        run: npm test --prefix scripts
      - name: Test standalone release packaging
        run: python scripts/test-package-release.py
      - name: Build native release
        run: cargo build --locked --release
      - name: Verify optimized help and offline swarm
        run: |
          "${{ matrix.binary }}" --help
          "${{ matrix.binary }}" demo 'Verify packaged native global-board collaboration and complete worker drain' --agents 500 --no-tui --grace-secs 0 --database release-smoke.sqlite3
      - name: Install Linux desktop WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install locked desktop frontend dependencies
        run: npm ci --prefix desktop
      - name: Test desktop frontend
        run: npm test --prefix desktop
      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - name: Test desktop host
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets
      - name: Check desktop Rust warnings
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      # Tauri runs the frontend's build/type-check command before building the host.
      - name: Build desktop release executable
        working-directory: desktop
        run: npm run tauri -- build --no-bundle --ci -- --locked
      - name: Stage executable-only release assets
        if: runner.os == 'Windows'
        run: python scripts/package-release.py --binary "${{ matrix.binary }}" --desktop-binary "${{ matrix.desktop_binary }}" --platform "${{ matrix.platform }}" --output dist
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-release-assets
          path: |
            dist/openraid.exe
            dist/openraid-desktop.exe
            dist/LICENSE
          if-no-files-found: error

  publish:
    name: Publish verified Windows executables and license
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist
      - name: Verify release asset allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          output = Path("dist")
          expected = {"openraid.exe", "openraid-desktop.exe", "LICENSE"}
          assert {path.name for path in output.iterdir()} == expected, "Unexpected release assets"
          assert all((output / name).is_file() and (output / name).stat().st_size for name in expected), "Missing or empty release asset"
          PY
      - name: Publish standalone assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Rerunning a tag replaces the old archive/checksum layout too.
            existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              case "$asset" in
                openraid.exe|openraid-desktop.exe|LICENSE) ;;
                *) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
              esac
            done <<< "$existing_assets"
            gh release upload "$GITHUB_REF_NAME" dist/openraid.exe dist/openraid-desktop.exe dist/LICENSE --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/openraid.exe dist/openraid-desktop.exe dist/LICENSE --verify-tag --draft --title "openraid $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          published_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | sort | join(",")')"
          [[ "$published_assets" == "LICENSE,openraid-desktop.exe,openraid.exe" ]]
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
