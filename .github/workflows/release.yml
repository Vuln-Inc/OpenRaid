name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: target/release/openraid
          - os: windows-2022
            platform: windows-x86_64
            binary: target/release/openraid.exe
          - os: macos-15-intel
            platform: darwin-x86_64
            binary: target/release/openraid
          - os: macos-15
            platform: darwin-arm64
            binary: target/release/openraid
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Verify version matches release tag
        run: |
          python -c 'import json,os,subprocess; p=json.loads(subprocess.check_output(["cargo","metadata","--locked","--no-deps","--format-version","1"])); v=next(x["version"] for x in p["packages"] if x["name"]=="openraid"); assert os.environ["GITHUB_REF_NAME"]=="v"+v, "Run this workflow from the matching vVERSION tag"'
      - name: Install locked sidecar dependencies
        run: npm ci --prefix scripts
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run native and integration tests
        run: cargo test --locked --all-targets -- --include-ignored
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify SDK and transport behavior
        run: npm test --prefix scripts
      - name: Build native release
        run: cargo build --locked --release
      - name: Verify optimized help and offline swarm
        run: |
          "${{ matrix.binary }}" --help
          "${{ matrix.binary }}" demo 'Verify packaged native global-board collaboration and complete worker drain' --agents 500 --no-tui --grace-secs 0 --database release-smoke.sqlite3
      - name: Package executable and runtime companions
        run: python scripts/package-release.py --binary "${{ matrix.binary }}" --platform "${{ matrix.platform }}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified platform archives
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "openraid $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
